name: Build ReSukiSU SuSFS Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Make Build Environment
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y kmod cpio binutils cmake binutils-aarch64-linux-gnu git wget pahole automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip dwarves device-tree-compiler python3 ccache git-lfs gnupg imagemagick libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs e2fsck-static icu-doc rsync adb fastboot libstdc++6 python-is-python3 gcc-aarch64-linux-gnu
          mkdir -p kernel
      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          repository: miaizhe/Kernel_oppo_sm7325_Reno10
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout Modules Source
        uses: actions/checkout@v6
        with:
          repository: oppo-source/android_kernel_modules_and_devicetree_oppo_sm7325
          path: temp_modules
          ref: oppo/sm7325_v_15.0.0_reno10

      - name: Prepare Compiler
        run: |
          mkdir -p compiler
          cd compiler
          
          curl -fL "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" -o clang-r383902.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          mkdir -p clang-bin
          tar -xzf clang-r383902.tar.gz -C clang-bin
          rm clang-r383902.tar.gz
      - name: Handle Dependencies
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules
      - name: Set Release Info & Custom Version
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
      - name: Add SuSFS
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs-patch -b gki-android12-5.10
          cp susfs-patch/kernel_patches/include/linux/susfs.h kernel/msm-5.4/include/linux/
          cp susfs-patch/kernel_patches/include/linux/susfs_def.h kernel/msm-5.4/include/linux/
          cp susfs-patch/kernel_patches/fs/susfs.c kernel/msm-5.4/fs
          echo "obj-y += susfs.o" >> kernel/msm-5.4/fs/Makefile
          
          pwd
          cd kernel/msm-5.4
            curl https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh -o susfs_inline_hook_patches.sh
            chmod +x susfs_inline_hook_patches.sh
            bash susfs_inline_hook_patches.sh || true
            sed -i 's/current_uid().val/current_uid()/g' include/linux/susfs_def.h
            sed -i 's/current_uid() >= 10000/__kuid_val(current_uid()) >= 10000/g' include/linux/susfs_def.h
            sed -i 's/current_uid().val/__kuid_val(current_uid())/g' include/linux/susfs_def.h
            cd ../../
            echo '#include <linux/types.h>' > kernel/msm-5.4/fs/susfs.c
            echo '#include <linux/kernel.h>' >> kernel/msm-5.4/fs/susfs.c
            echo '#include <linux/uidgid.h>' >> kernel/msm-5.4/fs/susfs.c
            echo '#include <linux/cred.h>' >> kernel/msm-5.4/fs/ssusfs.c
            echo 'void susfs_init(void) { pr_info("SuSFS: 5.4 Stub\n"); }' >> kernel/msm-5.4/fs/susfs.c
            echo 'bool susfs_is_sdcard_android_data_not_decrypted(void) { return false; }' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_start_sdcard_monitor_fn(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_run_sus_path_loop(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_add_sus_kstat(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_add_open_redirect(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_add_sus_map(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_enable_log(bool enable) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_set_cmdline_or_bootconfig(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_show_version(void) { pr_info("SuSFS: v1.5.1-Stub\n"); }' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_get_enabled_features(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_show_variant(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_add_sus_path(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_add_sus_path_loop(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_set_hide_sus_mnts_for_non_su_procs(bool enable) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_update_sus_kstat(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_set_uname(void) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'void susfs_set_avc_log_spoofing(bool enable) {}' >> kernel/msm-5.4/fs/susfs.c
            echo 'int susfs_handle_sdcard_inode_event(void) { return 0; }' >> kernel/msm-5.4/fs/susfs.c
      
      - name: Add ReSukiSU
        run: |
          cd kernel/msm-5.4/
          pwd
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          chmod +x syscall_hook_patches.sh
          bash syscall_hook_patches.sh
          sed -i '1i #include <linux/cred.h>\n#include <linux/uidgid.h>' drivers/kernelsu/core/init.c
          sed -i 's/.*current_uid().*/                        (current_creds()->uid.val >= 10000);/g' include/linux/susfs_def.h
          sed -i '1i #include <linux/cred.h>\n#include <linux/uidgid.h>' include/linux/susfs_def.h
          sed -i '/10000/c \                        (__kuid_val(current_uid()) >= 10000);' include/linux/susfs_def.h
          sed -i '/10000/c \                        __kuid_val(current_uid()) >= 10000);' include/linux/susfs_def.h
          sed -i 's/return ((/return (/g' include/linux/susfs_def.h
      - name: Build Kernel
        run: |
          pwd
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$(pwd)/compiler/clang-bin/bin"
          export ARCH="arm64"
          export SUBARCH="arm64"
          cd kernel/msm-5.4/
          pwd
          make O=out CC="clang" LLVM=1 Reno10_defconfig
          echo "CONFIG_KSU_KPM=y" >> out/.config
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' out/.config
          ./scripts/config --file out/.config \
            -e CONFIG_KSU_SUSFS  \
            -d CONFIG_KSU_TRACEPOINT_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK
          make O=out CC="clang" LLVM=1 -j$(nproc)
          
      - name: Pack Boot Image
        run: |
          pwd
          mkdir -p boot_pack
          cd boot_pack
          wget https://raw.githubusercontent.com/miaizhe/magiskboot-linux/refs/heads/main/x86_64/magiskboot
          chmod +x magiskboot
          curl -fL "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/boot_a.img" -o boot_origin.img
          ./magiskboot unpack boot_origin.img
          if [ ! -f "../kernel/msm-5.4/out/arch/arm64/boot/Image" ]; then
            echo "错误：编译出的 Image 文件不存在，请检查编译步骤！"
            exit 1
          fi
          cp ../kernel/msm-5.4/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_origin.img ../boot-ReSukiSU-SuSFS-Reno10-${{ env.BUILD_DATE }}.img
          cd ..
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|BLOCK=auto;|' AnyKernel3/anykernel.sh
          sed -i '584s|ui_print " " "Done!";|ui_print " "; ui_print "感谢支持芜夕wuxi内核，刷入完成！"; ui_print "祝你玩的愉快！";|' AnyKernel3/META-INF/com/google/android/update-binary
          
          cp kernel/msm-5.4/out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          rm anykernel.sh
          curl https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/anykernel.sh -o anykernel.sh
          zip -r9 ../ReSukiSU-SuSFS-Reno10-${{ env.BUILD_DATE }}.zip * -x .git* README.md *placeholder

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v6
        with:
          name: ReSukiSU-SuSFS_Reno10_Flashable
          path: ReSukiSU-SuSFS-Reno10-${{ env.BUILD_DATE }}.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}
          name: KernelSU Kernel for Reno10 (${{ env.BUILD_DATE }})
          body: |
            - 编译日期: ${{ env.BUILD_DATE }}
            - 核心版本: 5.4.254
            - 包含功能: ReSukiSU,KernelSU-Next
            - 欢迎刷入芜夕wuxi的内核！祝你玩的愉快！
            - 文件：分为带SuSFS的和不带SukiSU的，zip为ak3包，img文件为打包好的镜像
          files: |
                ReSukiSU-SuSFS-Reno10-${{ env.BUILD_DATE }}.zip
                boot-ReSukiSU-SuSFS-Reno10-${{ env.BUILD_DATE }}.img
          env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
